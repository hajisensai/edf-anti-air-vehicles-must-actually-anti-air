[AutoTurret]
; Saved edits apply within a second; no game restart needed.
; Only Vehicle603_Flak turrets whose guns carry this mod's marker (LockonType 4) are steered:
; the five KG6 Keplers and the Kepler YF-HV (anti-air), the KG7 Bohr / Bohr B (ground attack,
; LockonTargetType 1). Without the mod's weapon files the plugin leaves every vehicle alone.
Enabled=1
; 1 = write AIM lines to EDF6AutoTurret.log twice a second while tracking
Debug=0
; Stick input per radian of aim error (clamped to full stick)
Gain=3.0
; Turret axis angle = Sign * geometric angle + Offset (radians)
YawSign=1
YawOffset=0
PitchSign=-1
PitchOffset=0
; Turret pivot height above the vehicle origin, metres
PivotHeight=2.5
; Targets this far above the pivot are air targets. Anti-air guns pick any air target before a
; ground one; ground-attack guns (the Bohr) the other way round
AirHeight=12
; 1 = aim ahead of moving targets (uses the round's own flight time on its arc); 0 = aim straight at them
Lead=1
; The turret aims itself at locked targets within this share of the gun's range (0.75 = 360 m);
; with nothing that close you aim by hand
TrackRange=0.75
; Turn the turret at the target's own angular rate (1) instead of only chasing the error (0),
; which leaves the turret, and the rounds, trailing behind a crossing target
FeedForward=1
; Picking a new target: each radian the turret would have to turn counts as this many metres of
; distance, so it prefers targets near where the guns already point. The current target is kept
; until it dies or leaves the full gun range.
SlewWeight=250
; Push the aim stick past this to aim by hand while you hold it (0 = never). Letting go hands the
; turret back at once, to a target near where you dragged it; the target you dragged away from is
; skipped for DragDropMs
DragDeadzone=0.3
DragDropMs=3000
; Time fuse (flak rounds only): each shell bursts at the tracked target's range (1) or only at max range (0)
FuseToTarget=1
; Frames added to the computed fuse (negative = burst earlier, in front of the target)
FuseBiasFrames=0
; Never burst closer than this many frames after leaving the barrel
FuseMinFrames=4
; Proximity fuse: a round bursts where it passes closest to a locked target, if within this many metres (0 = off)
ProximityRadius=5
; 1 = a round bursts the moment it sticks to an enemy or the ground
ContactFuse=1
; Burst fireball size relative to the stock one (stock = AmmoExplosion/5, much smaller than the damage sphere)
BurstVisualScale=2.5
