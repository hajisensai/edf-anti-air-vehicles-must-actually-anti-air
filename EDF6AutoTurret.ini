[AutoTurret]
; Saved edits apply within a second; no game restart needed.
; Only Vehicle603_Flak turrets whose guns have a lock-on profile are steered
; (the KG6 Kepler Nereid from this mod); stock Keplers are left alone.
Enabled=1
; 1 = write AIM lines to EDF6AutoTurret.log twice a second while tracking
Debug=0
; Stick input per radian of aim error (clamped to full stick)
Gain=3.0
; Turret axis angle = Sign * geometric angle + Offset (radians)
YawSign=1
YawOffset=0
PitchSign=-1
PitchOffset=0
; Turret pivot height above the vehicle origin, metres
PivotHeight=2.5
; Targets this far above the pivot are air targets and are always preferred
AirHeight=12
; 1 = aim ahead of moving targets (uses the gun's own shell speed); 0 = aim straight at them
Lead=1
; The turret aims itself at locked targets within this share of the gun's range (0.75 = 360 m);
; with nothing that close you aim by hand
TrackRange=0.75
; Time fuse: each shell bursts at the tracked target's range (1) or only at max range (0)
FuseToTarget=1
; Frames added to the computed fuse (negative = burst earlier, in front of the target)
FuseBiasFrames=0
; Never burst closer than this many frames after leaving the barrel
FuseMinFrames=4
; Proximity fuse: a round bursts where it passes closest to a locked target, if within this many metres (0 = off)
ProximityRadius=6
; 1 = a round bursts the moment it sticks to an enemy or the ground
ContactFuse=1
; Lock slots per gun (stock data allows only 1). The guns lock everything in their full range so the
; proximity fuse knows where enemies are; the turret stays on its current target while it remains in range
MaxLocks=32
